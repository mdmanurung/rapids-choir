rscript: /exports/archive/hg-funcgenom-research/mdmanurung/conda/envs/R4_51/bin/Rscript
python: /exports/para-lipg-hpc/mdmanurung/rapids-choir/.envs/rapids-choir-cu128/bin/python
gpu_python: /exports/para-lipg-hpc/mdmanurung/rapids-choir/.envs/rapids-choir-cu128/bin/python
# CuPy only finds the pinned CUDA 12.8 toolkit when CONDA_PREFIX is set; running
# the interpreter by path without it falls through to a system CUDA 13 toolkit.
gpu_prefix: /exports/para-lipg-hpc/mdmanurung/rapids-choir/.envs/rapids-choir-cu128

# Attempts are append-only. Increment only after an admissible infrastructure
# invalidation; source changes create a new candidate commit automatically.
candidate_attempt: 1

authorization:
  operator: mdmanurung
  allowed_signers: workflow/authorization/allowed_signers
  comparator_confirm:
    manifest: workflow/authorization/comparator_confirm.json
    signature: workflow/authorization/comparator_confirm.sig
  hierarchy_confirm:
    Arigoni:
      manifest: workflow/authorization/hierarchy_arigoni.json
      signature: workflow/authorization/hierarchy_arigoni.sig
    Chen:
      manifest: workflow/authorization/hierarchy_chen.json
      signature: workflow/authorization/hierarchy_chen.sig

# These paths are intentionally absent until the custodian stages each sealed
# computational-parity input. The workflow will not infer or download them.
hierarchy_confirmation:
  Arigoni:
    h5ad: null
    recipe: null
    python_config: null
    custody_record: null
  Chen:
    h5ad: null
    recipe: null
    python_config: null
    custody_record: null

# Guarded publication/release targets consume reviewed, immutable artifacts.
# Null values make those targets fail closed without affecting the safe DAG.
publication_artifacts:
  claim_to_evidence_manifest: null
  manuscript: null
  figures_manifest: null
  tables_manifest: null
  supplement: null
  negative_results_appendix: null
  bmc_package: null
  venue_requirements_audit: null

release_artifacts:
  wheel: null
  sdist: null
  oci_image_manifest: null
  apptainer_definition: null
  documentation: null
  smoke_data: null
  sbom: null
  release_manifest: null
  checksums: null
  rights_audit: null
  credential_audit: null
  restricted_data_audit: null
  stale_evidence_audit: null
data:
  raw_root: /exports/archive/hg-funcgenom-research/mdmanurung/rapids-choir-data/raw
  work_root: /exports/para-lipg-hpc/mdmanurung/rapids-choir-data
  zenodo_archive_url: https://zenodo.org/records/14641222/files/Simulated_Datasets.tar.gz?download=1

slurm:
  gpu: L40S
  gres: "gpu:L40S:1"
  partition: gpu-long
  cpus_per_task: 8
  mem_mb: 64000
  runtime_minutes: 10080

# Gate 2 is sharded by dataset and frozen repeat so each authoritative L40S
# task fits the high-priority partition without changing per-pair timing.
gpu_chunk:
  gpu: L40S
  gres: "gpu:L40S:1"
  partition: gpu-short
  cpus_per_task: 4
  mem_mb: 32000
  runtime_minutes: 30
