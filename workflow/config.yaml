rscript: /exports/archive/hg-funcgenom-research/mdmanurung/conda/envs/R4_51/bin/Rscript
python: /exports/para-lipg-hpc/mdmanurung/rapids-choir/.envs/rapids-choir-cu128/bin/python
gpu_python: /exports/para-lipg-hpc/mdmanurung/rapids-choir/.envs/rapids-choir-cu128/bin/python
# CuPy only finds the pinned CUDA 12.8 toolkit when CONDA_PREFIX is set; running
# the interpreter by path without it falls through to a system CUDA 13 toolkit.
gpu_prefix: /exports/para-lipg-hpc/mdmanurung/rapids-choir/.envs/rapids-choir-cu128

# Attempts are append-only. Increment only after an admissible infrastructure
# invalidation; source changes create a new candidate commit automatically.
candidate_attempt: 1

authorization:
  operator: mdmanurung
  allowed_signers: workflow/authorization/allowed_signers
  comparator_confirm:
    manifest: workflow/authorization/comparator_confirm.json
    signature: workflow/authorization/comparator_confirm.sig

data:
  raw_root: /exports/archive/hg-funcgenom-research/mdmanurung/rapids-choir-data/raw
  work_root: /exports/para-lipg-hpc/mdmanurung/rapids-choir-data
  zenodo_archive_url: https://zenodo.org/records/14641222/files/Simulated_Datasets.tar.gz?download=1

slurm:
  gpu: L40S
  gres: "gpu:L40S:1"
  partition: gpu-long
  cpus_per_task: 8
  mem_mb: 64000
  runtime_minutes: 10080

# Gate 2 is sharded by dataset and frozen repeat so each authoritative L40S
# task fits the high-priority partition without changing per-pair timing.
gpu_chunk:
  gpu: L40S
  gres: "gpu:L40S:1"
  partition: gpu-short
  cpus_per_task: 4
  mem_mb: 32000
  runtime_minutes: 30
