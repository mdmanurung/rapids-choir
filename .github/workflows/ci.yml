name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test tools
        run: python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Lint
        run: python -m ruff check src tests validation/scripts docs/conf.py

      - name: Type-check
        run: python -m mypy

      - name: Run CPU-safe tests
        run: python -m pytest tests/unit -m "not reference"

      - name: Build wheel and source distribution
        run: python -m build

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and documentation tools
        run: python -m pip install --disable-pip-version-check -e ".[docs]"

      - name: Build documentation
        run: >-
          python -m sphinx -W --keep-going -E -a -b html
          docs docs/_build/html

      - name: Check external links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: >-
          python -m sphinx -W --keep-going -E -a -b linkcheck
          docs docs/_build/linkcheck
